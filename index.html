<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" id="meta-theme-color" content="#FF9800">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" id="meta-apple-status" content="#FF9800">
    <title>BehaviorCheck Pocket</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        :root { 
            --primary: #FF9800;
            --primary-dark: #F57C00; 
            --primary-light: #FFE0B2;
            --bg: #F4F6F8; 
            --text: #333; 
            --danger: #f44336; 
            --success: #4CAF50; 
            --card-bg: #ffffff;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Roboto', sans-serif; margin: 0; background-color: var(--bg); color: var(--text); overflow: hidden; display: flex; flex-direction: column; height: 100vh; }

        header { 
            background: var(--primary); color: white; padding: 16px 20px; 
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2); z-index: 20; flex-shrink: 0;
        }
        .header-left { display: flex; align-items: center; gap: 10px; }
        .header-left h1 { margin: 0; font-size: 1.3rem; font-weight: bold; letter-spacing: 0.5px; }
        .header-icons { display: flex; gap: 12px; align-items: center; }
        .icon-btn { cursor: pointer; font-size: 1.6rem; padding: 6px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white;}
        .icon-btn:active { background: rgba(255,255,255,0.2); }

        .screen { flex: 1; overflow-y: auto; display: none; flex-direction: column; padding: 15px; }
        .screen.active { display: flex; }
        
        .scroll-container { padding-bottom: 120px; }

        .home-controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .view-toggle { display: flex; background: #e0e0e0; border-radius: 20px; overflow: hidden; }
        .view-toggle button { background: none; border: none; padding: 8px 15px; color: #555; }
        .view-toggle button.active { background: var(--primary); color: white; }

        .student-item { 
            background: var(--card-bg); border-radius: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            display: flex; align-items: center; justify-content: space-between; padding: 15px; margin-bottom: 12px;
        }
        .students-container.grid { display: flex; flex-wrap: wrap; gap: 12px; }
        .students-container.grid .student-item { flex: 1 1 calc(50% - 6px); flex-direction: column; aspect-ratio: 1; text-align: center; }

        .behavior-row { display: flex; gap: 12px; margin-bottom: 15px; min-height: 85px; }
        .calib-col { display: flex; flex-direction: column; gap: 8px; width: 45px; }
        .calib-btn { flex: 1; border-radius: 10px; border: 1px solid #e0e0e0; background: white; font-size: 1.4rem; font-weight: bold; }
        .card-behavior-main { flex: 1; display: flex; background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
        .behavior-label-area { flex: 2; padding: 15px; border-left: 5px solid var(--primary); font-weight: bold; display: flex; align-items: center; }
        .behavior-count-area { flex: 1; background: var(--primary-light); display: flex; align-items: center; justify-content: center; font-size: 2.2rem; font-weight: 900; color: var(--primary-dark); }

        .whatsapp-btn { background: #25D366; color: white; border: none; padding: 16px; border-radius: 12px; font-size: 1.1rem; font-weight: bold; width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 10px; box-shadow: 0 4px 10px rgba(37, 211, 102, 0.3); }

        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 0.85rem; font-weight: bold; color: #666; margin-bottom: 5px; }
        .input-group input, .input-group textarea { width: 100%; padding: 14px; border: 2px solid #e0e0e0; border-radius: 10px; font-size: 1rem; outline: none; background: #fafafa; }

        .toggle-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #eee; }
        .switch { position: relative; width: 50px; height: 28px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 20px; width: 20px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--primary); }
        input:checked + .slider:before { transform: translateX(22px); }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center; z-index: 100; backdrop-filter: blur(2px); }
        .modal-content { background: white; padding: 24px; border-radius: 16px; width: 90%; max-width: 400px; max-height: 90vh; overflow-y: auto; }
        
        .btn-action { background: var(--primary); color: white; border: none; padding: 15px; border-radius: 10px; width: 100%; font-weight: bold; display: flex; justify-content: center; align-items: center; gap: 8px; margin-top: 10px; text-decoration: none; }
        .btn-danger { background: white; color: var(--danger); border: 2px solid var(--danger); }
        
        #toast { visibility: hidden; min-width: 250px; background-color: #333; color: #fff; text-align: center; border-radius: 8px; padding: 16px; position: fixed; z-index: 200; left: 50%; bottom: 50px; transform: translateX(-50%); opacity: 0; transition: 0.3s; }
        #toast.show { visibility: visible; opacity: 1; }

        .fab { position: fixed; bottom: 30px; right: 30px; background: var(--primary); color: white; width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 15px rgba(0,0,0,0.3); border: none; z-index: 30; }
    </style>
</head>
<body>

<header>
    <div class="header-left">
        <span class="icon-btn material-icons" id="btn-back" style="display:none;">arrow_back</span>
        <h1 id="header-title">BehaviorCheck</h1>
    </div>
    <div class="header-icons" id="header-actions"></div>
</header>

<div id="screen-home" class="screen active">
    <div class="home-controls">
        <div class="view-toggle">
            <button id="btn-grid-view" class="active" onclick="setViewMode('grid')"><span class="material-icons">grid_view</span></button>
            <button id="btn-list-view" onclick="setViewMode('list')"><span class="material-icons">view_list</span></button>
        </div>
        <button class="manage-btn" id="btn-manage" onclick="toggleManageMode()" style="background:none; border:none; font-weight:bold; color:var(--primary-dark);">GERENCIAR</button>
    </div>
    <div id="students-list" class="students-container grid"></div>
    <button class="fab" onclick="abrirModalAddAluno()"><span class="material-icons">person_add</span></button>
</div>

<div id="screen-student" class="screen">
    <div class="scroll-container">
        <div id="behaviors-list"></div>
        <button class="whatsapp-btn" onclick="gerarRelatorioWhatsApp()">
            <span class="material-icons">send</span> ENVIAR RELATÓRIO
        </button>
    </div>
</div>

<div id="screen-edit-student" class="screen">
    <div class="scroll-container">
        <div style="background: white; padding: 20px; border-radius: 12px; margin-bottom: 20px;">
            <div class="input-group"><label>Aluno</label><input type="text" id="edit-stu-name"></div>
            <div class="input-group"><label>Responsável</label><input type="text" id="edit-stu-mother"></div>
            <div class="input-group"><label>WhatsApp</label><input type="tel" id="edit-stu-whatsapp" oninput="mascaraTelefone(this)"></div>
        </div>
        <div style="background: white; padding: 20px; border-radius: 12px;">
            <h3 style="margin-top:0; font-size:1rem; color:var(--primary-dark);">Regras do Aluno</h3>
            <div id="student-rules-toggles"></div>
        </div>
        <button class="btn-action" style="background:var(--success); margin-top:20px;" onclick="salvarEdicaoAluno()">
            <span class="material-icons">save</span> SALVAR ALTERAÇÕES
        </button>
    </div>
</div>

<div id="modal-add-aluno" class="modal-overlay">
    <div class="modal-content">
        <h2 style="margin-top:0;">Novo Aluno</h2>
        <div class="input-group">
            <label>Nomes (separe por vírgula)</label>
            <textarea id="input-alunos-nomes" style="height:80px;"></textarea>
        </div>
        <button class="btn-action" onclick="salvarNovosAlunos()">CADASTRAR</button>
        <button class="btn-action btn-danger" onclick="fecharModais()">CANCELAR</button>
    </div>
</div>

<div id="custom-dialog" class="modal-overlay" style="z-index: 300;">
    <div class="modal-content" style="text-align: center;">
        <span class="material-icons" id="dialog-icon" style="font-size: 3rem; color: var(--primary);">info</span>
        <h3 id="dialog-title">Aviso</h3>
        <p id="dialog-message"></p>
        <div style="display: flex; gap: 10px;">
            <button id="dialog-btn-cancel" class="btn-action btn-danger" style="display:none;" onclick="fecharDialogo()">CANCELAR</button>
            <button id="dialog-btn-confirm" class="btn-action">OK</button>
        </div>
    </div>
</div>

<div id="toast"></div>

<script>
    let db = JSON.parse(localStorage.getItem('bc_pocket_db')) || { students: [], rules: [], config: { theme: 'orange' } };
    let currentStudentId = null;
    let manageMode = false;
    let currentView = 'grid';

    if(db.rules.length === 0) {
        db.rules = [
            {id: 1, rotulo: "Agressão física"}, {id: 2, rotulo: "Agressão verbal"},
            {id: 3, rotulo: "Desafiou autoridade"}, {id: 4, rotulo: "Atrapalhou a aula"}
        ];
    }

    function save() { localStorage.setItem('bc_pocket_db', JSON.stringify(db)); }

    function navTo(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        const headerTitle = document.getElementById('header-title');
        const btnBack = document.getElementById('btn-back');
        const actions = document.getElementById('header-actions');
        
        btnBack.style.display = (screenId === 'home') ? 'none' : 'block';
        actions.innerHTML = '';

        if(screenId === 'home') {
            document.getElementById('screen-home').classList.add('active');
            headerTitle.innerText = "BehaviorCheck";
            actions.innerHTML = '<span class="icon-btn material-icons" onclick="location.reload()">refresh</span>';
        } 
        else if (screenId === 'student') {
            const stu = db.students.find(s => s.id === currentStudentId);
            document.getElementById('screen-student').classList.add('active');
            headerTitle.innerText = stu.name;
            actions.innerHTML = '<span class="icon-btn material-icons" onclick="navTo(\'edit-student\')">edit</span>';
            btnBack.onclick = () => navTo('home');
            renderBehaviors();
        }
        else if (screenId === 'edit-student') {
            document.getElementById('screen-edit-student').classList.add('active');
            headerTitle.innerText = "Editar Aluno";
            // Sem ícone extra no cabeçalho aqui
            btnBack.onclick = () => navTo('student');
            preencherEdicao();
        }
    }

    function renderStudents() {
        const container = document.getElementById('students-list');
        container.innerHTML = '';
        db.students.sort((a,b) => a.name.localeCompare(b.name)).forEach(s => {
            const div = document.createElement('div');
            div.className = 'student-item';
            div.innerHTML = `<div><strong>${s.name}</strong></div><span class="material-icons">${manageMode ? 'delete' : 'chevron_right'}</span>`;
            div.onclick = () => manageMode ? excluirAluno(s.id) : handleStudentClick(s.id);
            container.appendChild(div);
        });
    }

    function handleStudentClick(id) { currentStudentId = id; navTo('student'); }

    function renderBehaviors() {
        const stu = db.students.find(s => s.id === currentStudentId);
        const container = document.getElementById('behaviors-list');
        container.innerHTML = '';
        const activeRules = db.rules.filter(r => !(stu.inactiveRules || []).includes(r.id));
        
        activeRules.forEach(rule => {
            const count = (stu.counts || {})[rule.id] || 0;
            const div = document.createElement('div');
            div.className = 'behavior-row';
            div.innerHTML = `
                <div class="calib-col">
                    <button class="calib-btn" onclick="ajustar(${rule.id}, 1)">+</button>
                    <button class="calib-btn" onclick="ajustar(${rule.id}, -1)">-</button>
                </div>
                <div class="card-behavior-main" onclick="ajustar(${rule.id}, 1)">
                    <div class="behavior-label-area">${rule.rotulo}</div>
                    <div class="behavior-count-area">${count}</div>
                </div>`;
            container.appendChild(div);
        });
    }

    function ajustar(ruleId, delta) {
        const stu = db.students.find(s => s.id === currentStudentId);
        if(!stu.counts) stu.counts = {};
        stu.counts[ruleId] = Math.max(0, (stu.counts[ruleId] || 0) + delta);
        save();
        renderBehaviors();
    }

    function gerarRelatorioWhatsApp() {
        const stu = db.students.find(s => s.id === currentStudentId);
        if(!stu.whatsapp) { showToast("Cadastre o WhatsApp da mãe!"); return; }
        
        let msg = `Olá, registro de hoje para ${stu.name}:\n\n`;
        let has = false;
        Object.entries(stu.counts || {}).forEach(([id, count]) => {
            if(count > 0) {
                const r = db.rules.find(x => x.id == id);
                msg += `• ${r.rotulo}: ${count}x\n`;
                has = true;
            }
        });
        if(!has) msg += "Comportamento excelente! ✨";

        const url = `whatsapp://send?phone=55${stu.whatsapp.replace(/\D/g,'')}&text=${encodeURIComponent(msg)}`;
        
        customConfirm("Enviar e zerar dados?", () => {
            stu.counts = {};
            save();
            renderBehaviors();
            
            // A PONTE DE COMUNICAÇÃO NATIVA
            if (window.AppInventor) {
                window.AppInventor.setWebViewString(url);
            } else {
                window.location.href = url; // Caso teste no navegador do PC
            }
        });
    }

    function preencherEdicao() {
        const stu = db.students.find(s => s.id === currentStudentId);
        document.getElementById('edit-stu-name').value = stu.name;
        document.getElementById('edit-stu-mother').value = stu.motherName || '';
        document.getElementById('edit-stu-whatsapp').value = stu.whatsapp || '';
        
        const container = document.getElementById('student-rules-toggles');
        container.innerHTML = '';
        db.rules.forEach(r => {
            const active = !(stu.inactiveRules || []).includes(r.id);
            container.innerHTML += `
                <div class="toggle-row">
                    <span>${r.rotulo}</span>
                    <label class="switch">
                        <input type="checkbox" id="reg-${r.id}" ${active ? 'checked' : ''}>
                        <span class="slider"></span>
                    </label>
                </div>`;
        });
    }

    function salvarEdicaoAluno() {
        const stu = db.students.find(s => s.id === currentStudentId);
        stu.name = document.getElementById('edit-stu-name').value.toUpperCase();
        stu.motherName = document.getElementById('edit-stu-mother').value;
        stu.whatsapp = document.getElementById('edit-stu-whatsapp').value;
        stu.inactiveRules = [];
        db.rules.forEach(r => {
            if(!document.getElementById(`reg-${r.id}`).checked) stu.inactiveRules.push(r.id);
        });
        save();
        showToast("Salvo!");
        navTo('student');
    }

    function salvarNovosAlunos() {
        const nomes = document.getElementById('input-alunos-nomes').value.split(',');
        nomes.forEach(n => {
            if(n.trim()) db.students.push({ id: Date.now()+Math.random(), name: n.trim().toUpperCase(), counts: {}, inactiveRules: [] });
        });
        save();
        fecharModais();
        renderStudents();
    }

    // Funções Auxiliares
    function abrirModalAddAluno() { document.getElementById('modal-add-aluno').style.display = 'flex'; }
    function fecharModais() { document.querySelectorAll('.modal-overlay').forEach(m => m.style.display = 'none'); }
    function setViewMode(m) { currentView = m; document.getElementById('students-list').className = 'students-container ' + m; }
    function toggleManageMode() { manageMode = !manageMode; renderStudents(); }
    function mascaraTelefone(i) { i.value = i.value.replace(/\D/g,'').replace(/(\d{2})(\d{5})(\d{4})/, "($1) $2-$3"); }
    function showToast(m) { const t = document.getElementById('toast'); t.innerText = m; t.className = 'show'; setTimeout(()=>t.className='', 2000); }
    
    function customConfirm(msg, cb) {
        document.getElementById('dialog-message').innerText = msg;
        document.getElementById('dialog-btn-cancel').style.display = 'block';
        document.getElementById('dialog-btn-confirm').onclick = () => { fecharDialogo(); cb(); };
        document.getElementById('custom-dialog').style.display = 'flex';
    }
    function fecharDialogo() { document.getElementById('custom-dialog').style.display = 'none'; }

    renderStudents();
</script>
</body>
</html>
